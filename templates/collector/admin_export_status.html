{% extends 'collector/admin_base.html' %}
{% block title %}导出任务 · {{ site_name }}{% endblock %}
{% block admin_content %}
<section class="panel export-status" data-status-url="{% url 'admin-export-job-status' job.pk %}">
  <div class="eyebrow">后台导出 / 独立任务</div>
  <h1>导出任务</h1>
  <p id="export-status-text">{{ job.get_status_display }}，请不要重复点击导出。</p>
  <div id="export-result" hidden>
    <p>已生成 <strong id="export-count">0</strong> 名学生的资料。</p>
    <a id="export-download" class="button primary" href="#">下载 ZIP →</a>
  </div>
  <div id="export-error" class="error-message" hidden></div>
  <p><a class="text-link" href="{% url 'admin-students' %}">返回学生资料与导出</a></p>
</section>
<script>
(() => {
  const root = document.querySelector('.export-status');
  const text = document.getElementById('export-status-text');
  const result = document.getElementById('export-result');
  const count = document.getElementById('export-count');
  const download = document.getElementById('export-download');
  const error = document.getElementById('export-error');
  const poll = async () => {
    try {
      const response = await fetch(root.dataset.statusUrl, {headers: {Accept: 'application/json'}, credentials: 'same-origin'});
      if (!response.ok) throw new Error('状态查询失败');
      const data = await response.json();
      text.textContent = data.status === 'completed' ? '导出已完成。' : `${data.status_label}，请不要重复点击导出。`;
      if (data.status === 'completed') {
        count.textContent = data.student_count;
        download.href = data.download_url;
        result.hidden = false;
        return;
      }
      if (data.status === 'failed') {
        error.textContent = data.error || '导出失败，请稍后重试。';
        error.hidden = false;
        return;
      }
      window.setTimeout(poll, 2000);
    } catch (err) {
      text.textContent = '暂时无法查询任务状态，正在重试。';
      window.setTimeout(poll, 3000);
    }
  };
  poll();
})();
</script>
{% endblock %}
