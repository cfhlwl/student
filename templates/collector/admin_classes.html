{% extends 'collector/admin_base.html' %}
{% block title %}学年与班级 · {{ site_name }}{% endblock %}
{% block admin_content %}<div class="page-heading"><div><div class="eyebrow">采集范围</div><h1>学年与班级</h1></div></div><section class="split-panel"><form method="post" class="panel form-panel">{% csrf_token %}<label>学年<input name="school_year" placeholder="例如 2026-2027" required></label><label>学部<select name="department"><option value="middle">初中部</option><option value="high">高中部</option></select></label><label>年级<select name="grade"><option>初一</option><option>初二</option><option>初三</option><option>高一</option><option>高二</option><option>高三</option></select></label><label>班级<input name="name" placeholder="例如 1" required></label><button class="button primary" type="submit">保存班级范围</button></form><div class="panel"><span class="kicker">已配置</span><h2>班级范围列表</h2><div class="tag-cloud">{% for item in classes %}<span>{{ item }}</span>{% empty %}<p class="empty">尚未配置。</p>{% endfor %}</div></div></section>{% endblock %}
