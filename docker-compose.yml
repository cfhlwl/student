services:
  web:
    build: .
    env_file: .env
    environment:
      SITE_URL: ${SITE_URL:-http://192.168.88.99:8080}
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - staticfiles:/app/staticfiles
    expose:
      - "8000"
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro

volumes:
  staticfiles:

