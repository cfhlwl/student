services:
  web:
    build: .
    env_file: ${ENV_FILE:-.env}
    environment:
      SITE_URL: ${SITE_URL:-http://192.168.88.99:8080}
    command: ["sh", "-c", "python manage.py collectstatic --noinput && mkdir -p \"${EXPORT_TEMP_DIR:-/app/data/exports}\" && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 300"]
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - staticfiles:/app/staticfiles
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
  export-worker:
    build: .
    env_file: ${ENV_FILE:-.env}
    environment:
      SITE_URL: ${SITE_URL:-http://192.168.88.99:8080}
    command: ["python", "manage.py", "process_exports", "--poll-seconds", "2"]
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./media:/app/media:ro
      - staticfiles:/app/staticfiles:ro
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      - ./data/exports:/app/data/exports:ro

volumes:
  staticfiles:

